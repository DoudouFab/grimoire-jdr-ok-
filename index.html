<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire Audio JDR</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131822;
            --card-bg: #1a2230;
            --card-hover: #222d40;
            --gold: #d4af37;
            --gold-bright: #f3e5ab;
            --accent-play: #2ecc71;
            --accent-stop: #e74c3c;
            --text-color: #94a3b8;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            background-image: radial-gradient(circle at center, #182232 0%, #0b0e14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 5px 2px 5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 6px;
        }

        h1 { 
            margin: 0; 
            font-size: 0.9rem; 
            color: var(--gold); 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .master-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            gap: 8px;
        }

        .btn-master-stop {
            background: var(--accent-stop);
            color: white;
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-master-stop:hover { background: #c0392b; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

        .global-vol {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #fff;
        }

        .global-vol input[type="range"] {
            accent-color: var(--gold);
            width: 110px;
            cursor: pointer;
        }

        /* Fenêtre de contrôle supérieure unifiée */
        .control-drawer {
            display: none;
            background: #07090d;
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .control-drawer.open {
            display: block;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 3px;
        }

        .drawer-title {
            color: var(--gold-bright);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .controls-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .btn {
            font-family: inherit;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.15s;
            text-align: center;
        }

        .btn-play {
            background: #143322;
            color: var(--accent-play);
            border: 1px solid rgba(46, 204, 113, 0.3);
            flex: 2;
        }
        .btn-play:hover { background: var(--accent-play); color: white; }

        .btn-stop {
            background: #331414;
            color: var(--accent-stop);
            border: 1px solid rgba(231, 76, 60, 0.3);
            flex: 1;
        }
        .btn-stop:hover { background: var(--accent-stop); color: white; }

        .btn-loop {
            background: #1e293b;
            color: #64748b;
            border: 1px solid #334155;
            flex: 1.2;
        }
        .btn-loop.active {
            background: #0f3443;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .extra-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #64748b;
            gap: 8px;
        }

        .vol-control {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .vol-control input[type="range"] {
            flex: 1;
            accent-color: var(--gold);
            height: 3px;
            background: #131822;
            cursor: pointer;
        }

        .delay-control select {
            background: #131822;
            color: var(--text-color);
            border: 1px solid #27354a;
            font-size: 0.7rem;
            border-radius: 4px;
            padding: 2px;
            cursor: pointer;
        }

        /* Panneau des sons en cours */
        .active-sounds-panel {
            background: #0d121b;
            border: 1px solid rgba(46, 204, 113, 0.4);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .active-sounds-title {
            font-size: 0.75rem;
            color: var(--accent-play);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .active-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
        }

        .active-tag {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid var(--accent-play);
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .active-tag:hover {
            background: rgba(46, 204, 113, 0.3);
        }

        .active-tag button {
            background: none;
            border: none;
            color: var(--accent-stop);
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 2px;
        }

        /* Organisation principale en 2 tableaux agrandis */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        @media (min-width: 900px) {
            .container { grid-template-columns: 1fr 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            border: 1px solid #222d40;
            display: flex;
            flex-direction: column;
            height: 72vh;
        }

        h2 { 
            font-size: 0.85rem; 
            color: var(--gold); 
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #222d40;
            padding-bottom: 4px;
        }

        .sound-grid-container {
            overflow-y: auto;
            padding-right: 4px;
            flex: 1;
        }

        .sound-grid-container::-webkit-scrollbar { width: 4px; }
        .sound-grid-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        /* Grille adaptative : 4-5 en PC, 3 en GSM, tuiles plus compactes */
        .tiles-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        @media (min-width: 768px) {
            .tiles-container {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .sound-tile {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 10px 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            min-height: 42px;
            text-align: center;
        }

        .sound-tile:hover {
            background-color: var(--card-hover);
            filter: brightness(1.2);
        }

        .sound-tile.playing {
            border: 1px solid var(--accent-play) !important;
            background: rgba(46, 204, 113, 0.2);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
        }

        .sound-tile.active-panel {
            border: 1px solid var(--gold) !important;
            background: var(--card-hover);
        }

        /* Police d'écriture agrandie sur les tuiles */
        .sound-title {
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.15;
        }

        .sub-category {
            font-size: 0.68rem;
            color: var(--gold);
            margin: 8px 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-left: 2px solid var(--gold);
            padding-left: 4px;
        }
    </style>
</head>
<body>

        const oneshots = [

        let globalVolume = 0.8;
        const soundStates = {};

        function renderTiles(data, containerId, drawerId, defaultLoop) {
            const container = document.getElementById(containerId);
            let currentCat = "";
            let currentGrid = container;

            data.forEach(item => {
                if (item.cat !== currentCat) {
                    currentCat = item.cat;
                    const catDiv = document.createElement('div');
                    catDiv.className = 'sub-category';
                    catDiv.innerText = currentCat;
                    container.appendChild(catDiv);

                    currentGrid = document.createElement('div');
                    currentGrid.className = 'tiles-container';
                    container.appendChild(currentGrid);
                }

                soundStates[item.id] = {
                    id: item.id,
                    name: item.name,
                    filename: `${item.id}.mp3`,
                    activeAudios: [], 
                    isLooping: defaultLoop,
                    volume: 1.0,
                    delay: 0,
                    timer: null,
                    type: (containerId === 'ambient-grid-container' ? 'ambient' : 'oneshot')
                };

                const tile = document.createElement('div');
                tile.className = 'sound-tile';
                tile.id = `tile-${item.id}`;
                tile.style.border = `1px solid ${item.color}55`;
                tile.style.backgroundColor = `${item.color}15`;
                tile.onclick = () => openDrawer(item.id);

                tile.innerHTML = `
                    <span class="sound-title" style="color: ${item.textCol};">${item.name}</span>
                `;
                currentGrid.appendChild(tile);
            });
        }

        function openDrawer(id) {
            const item = [...ambients, ...oneshots].find(s => s.id === id);
            const state = soundStates[id];
            
            // Détermine quel panneau de contrôle supérieur utiliser selon le type de son
            const drawerId = (state.type === 'ambient') ? 'drawer-ambient' : 'drawer-oneshot';
            const otherDrawerId = (state.type === 'ambient') ? 'drawer-oneshot' : 'drawer-ambient';

            // Ferme l'autre tiroir
            document.getElementById(otherDrawerId).className = "control-drawer";

            document.querySelectorAll('.sound-tile').forEach(t => t.classList.remove('active-panel'));
            const tile = document.getElementById(`tile-${id}`);
            if(tile) tile.classList.add('active-panel');

            const drawer = document.getElementById(drawerId);
            drawer.className = "control-drawer open";
            drawer.innerHTML = `
                <div class="drawer-header">
                    <span class="drawer-title">🎛️ ${item.name}</span>
                    <button class="btn" style="background:#1e293b; color:#fff; padding:2px 6px;" onclick="closeDrawer('${drawerId}')">✕</button>
                </div>
                <div class="controls-row">
                    <button class="btn btn-play" onclick="playSound('${id}')">▶ Lancer</button>
                    <button class="btn btn-stop" onclick="stopSound('${id}')">■ Stop</button>
                    <button class="btn btn-loop ${state.isLooping ? 'active' : ''}" id="loop-${id}" onclick="toggleLoop('${id}')">Boucle</button>
                </div>
                <div class="extra-controls">
                    <div class="vol-control">
                        <span>🔊 Vol:</span>
                        <input type="range" min="0" max="1" step="0.05" value="${state.volume}" oninput="updateSoundVolume('${id}', this.value)">
                    </div>
                    <div class="delay-control">
                        <select id="delay-${id}" onchange="updateSoundDelay('${id}', this.value)">
                            <option value="0" ${state.delay === 0 ? 'selected' : ''}>⏱️ Répétition : Off</option>
                            <option value="5" ${state.delay === 5 ? 'selected' : ''}>⏱️ 5s</option>
                            <option value="10" ${state.delay === 10 ? 'selected' : ''}>⏱️ 10s</option>
                            <option value="20" ${state.delay === 20 ? 'selected' : ''}>⏱️ 20s</option>
                            <option value="45" ${state.delay === 45 ? 'selected' : ''}>⏱️ 45s</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function closeDrawer(drawerId) {
            document.getElementById(drawerId).className = "control-drawer";
            document.querySelectorAll('.sound-tile').forEach(t => t.classList.remove('active-panel'));
        }

        function updateActiveSoundsDisplay() {
            const listContainer = document.getElementById('active-sounds-list');
            let activeItems = [];

            Object.keys(soundStates).forEach(id => {
                if (soundStates[id].activeAudios.length > 0) {
                    activeItems.nodeValue;
                    activeItems.push(`
                        <div class="active-tag" title="Cliquez pour configurer" onclick="openDrawer('${id}')">
                            <span>🎵 ${soundStates[id].name}</span>
                            <button onclick="event.stopPropagation(); stopSound('${id}')">✕</button>
                        </div>
                    `);
                }
            });

            if (activeItems.length > 0) {
                listContainer.innerHTML = activeItems.join('');
            } else {
                listContainer.innerHTML = `<span style="font-size: 0.75rem; color: #64748b;">Aucun son actif</span>`;
            }
        }

        function playSound(id) {
            const state = soundStates[id];
            const tile = document.getElementById(`tile-${id}`);

            if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }

            const audio = new Audio(state.filename);
            audio.loop = state.isLooping;
            audio.volume = state.volume * globalVolume;

            state.activeAudios.push(audio);
            if(tile) tile.classList.add('playing');
            updateActiveSoundsDisplay();

            audio.onended = () => {
                state.activeAudios = state.activeAudios.filter(a => a !== audio);
                if (state.activeAudios.length === 0 && tile) tile.classList.remove('playing');
                updateActiveSoundsDisplay();

                if (!state.isLooping && state.delay > 0) {
                    state.timer = setTimeout(() => playSound(id), state.delay * 1000);
                }
            };

            audio.play().catch(e => console.log(`Erreur audio : ${state.filename}`));
        }

        function stopSound(id) {
            const state = soundStates[id];
            const tile = document.getElementById(`tile-${id}`);

            state.activeAudios.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            state.activeAudios = [];

            if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }
            if (tile) tile.classList.remove('playing');
            updateActiveSoundsDisplay();
        }

        function toggleLoop(id) {
            const state = soundStates[id];
            const loopBtn = document.getElementById(`loop-${id}`);
            state.isLooping = !state.isLooping;

            if (state.isLooping) {
                if(loopBtn) loopBtn.classList.add('active');
                document.getElementById(`delay-${id}`).value = "0";
                state.delay = 0;
                if (state.timer) clearTimeout(state.timer);
            } else {
                if(loopBtn) loopBtn.classList.remove('active');
            }

            state.activeAudios.forEach(audio => audio.loop = state.isLooping);
        }

        function updateSoundVolume(id, val) {
            const state = soundStates[id];
            state.volume = parseFloat(val);
            state.activeAudios.forEach(audio => audio.volume = state.volume * globalVolume);
        }

        function updateSoundDelay(id, val) {
            const state = soundStates[id];
            state.delay = parseInt(val);
            if (state.delay > 0) {
                state.isLooping = false;
                const loopBtn = document.getElementById(`loop-${id}`);
                if(loopBtn) loopBtn.classList.remove('active');
            } else if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }
        }

        function stopAllSounds() {
            Object.keys(soundStates).forEach(id => stopSound(id));
        }

        function updateGlobalVolume(val) {
            globalVolume = parseFloat(val);
            Object.keys(soundStates).forEach(id => {
                soundStates[id].activeAudios.forEach(audio => {
                    audio.volume = soundStates[id].volume * globalVolume;
                });
            });
        }

        renderTiles(ambients, 'ambient-grid-container', 'drawer-ambient', true);
        renderTiles(oneshots, 'oneshot-grid-container', 'drawer-oneshot', false);
    </script>
</body>
</html>
