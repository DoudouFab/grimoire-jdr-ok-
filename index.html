<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire Audio JDR - Elite X2 Master</title>
    <style>
        :root {
            --bg-color: #05070a;
            --panel-bg: #0d1118;
            --card-bg: #131a26;
            --card-hover: #1c2638;
            --gold: #d4af37;
            --gold-bright: #f3e5ab;
            --accent-play: #2ecc71;
            --accent-stop: #e74c3c;
            --text-color: #94a3b8;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            flex-shrink: 0;
        }

        h1 { 
            margin: 0; 
            font-size: 1.3rem; 
            color: var(--gold); 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Barre maître compacte et ultra-rapide */
        .master-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            flex-shrink: 0;
        }

        .btn-master-stop {
            background: var(--accent-stop);
            color: white;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-master-stop:hover { background: #c0392b; }

        .global-vol {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #fff;
            font-weight: bold;
        }

        .global-vol input[type="range"] {
            accent-color: var(--gold);
            width: 120px;
            cursor: pointer;
        }

        /* Conteneur principal optimisé pour l'écran tactile de l'Elite X2 */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-grow: 1;
            min-height: 0;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        h2 { 
            font-size: 0.95rem; 
            color: var(--gold); 
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
            flex-shrink: 0;
        }

        /* Grille de tuiles ultra compactes */
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
            flex-grow: 1;
        }

        .sound-grid::-webkit-scrollbar { width: 5px; }
        .sound-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .sound-card {
            background: var(--card-bg);
            border: 1px solid #222d40;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.1s ease;
        }

        .sound-card:hover {
            background-color: var(--card-hover);
            border-color: var(--gold);
        }

        .sound-card.playing {
            border-color: var(--accent-play);
            background: rgba(46, 204, 113, 0.12);
        }

        .sound-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sound-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sound-card.playing .sound-title {
            color: var(--gold-bright);
        }

        .sound-id {
            font-family: monospace;
            font-size: 0.65rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Boutons larges et tactiles */
        .controls-row {
            display: flex;
            gap: 4px;
        }

        .btn {
            font-family: inherit;
            border: none;
            padding: 5px 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
        }

        .btn-play {
            background: #0f291e;
            color: var(--accent-play);
            border: 1px solid rgba(46, 204, 113, 0.3);
            flex: 2;
        }
        .btn-play:hover { background: var(--accent-play); color: white; }

        .btn-stop {
            background: #2c1515;
            color: var(--accent-stop);
            border: 1px solid rgba(231, 76, 60, 0.3);
            flex: 1;
        }
        .btn-stop:hover { background: var(--accent-stop); color: white; }

        .btn-loop {
            background: #111827;
            color: #64748b;
            border: 1px solid #1f2937;
            flex: 1.2;
        }
        .btn-loop.active {
            background: #0f2b3d;
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.4);
        }

        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .vol-control {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .vol-control input[type="range"] {
            width: 100%;
            accent-color: var(--gold);
            height: 3px;
            background: #05070a;
            cursor: pointer;
        }

        /* Remplacement des menus déroulants par des boutons de répétition directs tactiles */
        .repeat-pills {
            display: flex;
            gap: 2px;
        }

        .btn-repeat {
            background: #090d14;
            color: #64748b;
            border: 1px solid #1e293b;
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-repeat.active {
            background: var(--gold);
            color: #05070a;
            font-weight: bold;
            border-color: var(--gold);
        }

        .sub-category {
            grid-column: 1 / -1;
            font-size: 0.7rem;
            color: var(--gold);
            margin-top: 6px;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-left: 2px solid var(--gold);
            padding-left: 4px;
        }
    </style>
</head>

        let globalVolume = 0.8;
        const soundStates = {};

        function renderGrid(data, gridId, defaultLoop) {
            const grid = document.getElementById(gridId);
            let currentCat = "";

            data.forEach(item => {
                if (item.cat !== currentCat) {
                    currentCat = item.cat;
                    const catDiv = document.createElement('div');
                    catDiv.className = 'sub-category';
                    catDiv.innerText = currentCat;
                    grid.appendChild(catDiv);
                }

                soundStates[item.id] = {
                    id: item.id,
                    name: item.name,
                    filename: `${item.id}.mp3`,
                    activeAudios: [], 
                    isLooping: defaultLoop,
                    volume: 1.0,
                    delay: 0,
                    timer: null
                };

                const card = document.createElement('div');
                card.className = 'sound-card';
                card.id = `card-${item.id}`;

                card.innerHTML = `
                    <div class="sound-info">
                        <span class="sound-title">${item.name}</span>
                        <span class="sound-id">#${item.id}</span>
                    </div>
                    
                    <div class="controls-row">
                        <button class="btn btn-play" onclick="playSound('${item.id}')">▶ Lancer</button>
                        <button class="btn btn-stop" onclick="stopSound('${item.id}')">■ Stop</button>
                        <button class="btn btn-loop ${defaultLoop ? 'active' : ''}" id="loop-${item.id}" onclick="toggleLoop('${item.id}')">Boucle</button>
                    </div>

                    <div class="extra-controls">
                        <div class="vol-control">
                            <span>🔊</span>
                            <input type="range" min="0" max="1" step="0.05" value="1" oninput="updateSoundVolume('${item.id}', this.value)">
                        </div>
                        <div class="repeat-pills">
                            <button class="btn-repeat active" id="del0-${item.id}" onclick="setDelay('${item.id}', 0)">Off</button>
                            <button class="btn-repeat" id="del5-${item.id}" onclick="setDelay('${item.id}', 5)">5s</button>
                            <button class="btn-repeat" id="del10-${item.id}" onclick="setDelay('${item.id}', 10)">10s</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playSound(id) {
            const state = soundStates[id];
            const card = document.getElementById(`card-${id}`);

            if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }

            const audio = new Audio(state.filename);
            audio.loop = state.isLooping;
            audio.volume = state.volume * globalVolume;

            state.activeAudios.push(audio);
            card.classList.add('playing');

            audio.onended = () => {
                state.activeAudios = state.activeAudios.filter(a => a !== audio);
                if (state.activeAudios.length === 0) card.classList.remove('playing');

                if (!state.isLooping && state.delay > 0) {
                    state.timer = setTimeout(() => playSound(id), state.delay * 1000);
                }
            };

            audio.play().catch(e => console.log(`Erreur audio : ${state.filename}`));
        }

        function stopSound(id) {
            const state = soundStates[id];
            const card = document.getElementById(`card-${id}`);

            state.activeAudios.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            state.activeAudios = [];

            if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }
            card.classList.remove('playing');
        }
