<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire Audio JDR</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131822;
            --card-bg: #1a2230;
            --card-hover: #222d40;
            --gold: #d4af37;
            --gold-bright: #f3e5ab;
            --accent-play: #2ecc71;
            --accent-stop: #e74c3c;
            --text-color: #94a3b8;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            background-image: radial-gradient(circle at center, #182232 0%, #0b0e14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 5px 2px 5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 6px;
        }

        h1 { 
            margin: 0; 
            font-size: 0.9rem; 
            color: var(--gold); 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .master-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            gap: 8px;
        }
