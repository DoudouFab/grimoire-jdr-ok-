<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire Audio JDR - Mode Tuiles</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131822;
            --card-bg: #1a2230;
            --card-hover: #222d40;
            --gold: #d4af37;
            --gold-bright: #f3e5ab;
            --accent-play: #2ecc71;
            --accent-stop: #e74c3c;
            --text-color: #94a3b8;
            --text-title: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            background-image: radial-gradient(circle at center, #182232 0%, #0b0e14 100%);
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            color: var(--gold); 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .master-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-master-stop {
            background: var(--accent-stop);
            color: white;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-master-stop:hover { background: #c0392b; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

        .global-vol {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #fff;
        }

        .global-vol input[type="range"] {
            accent-color: var(--gold);
            width: 150px;
            cursor: pointer;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 1000px) {
            .container { grid-template-columns: 1fr 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #222d40;
        }

        h2 { 
            font-size: 1.1rem; 
            color: var(--gold); 
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #222d40;
            padding-bottom: 6px;
        }

        .sound-grid-container {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .sound-grid-container::-webkit-scrollbar { width: 4px; }
        .sound-grid-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .tiles-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .sound-tile {
            background: var(--card-bg);
            border: 1px solid #27354a;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
            min-height: 45px;
        }

        .sound-tile:hover {
            background-color: var(--card-hover);
            border-color: var(--gold);
        }

        .sound-tile.playing {
            border-color: var(--accent-play);
            background: rgba(46, 204, 113, 0.12);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }

        .sound-tile.active-panel {
            border-color: var(--gold);
            background: var(--card-hover);
        }

        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 5px;
        }

        .sound-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-title);
            line-height: 1.2;
        }

        .sound-id {
            font-family: monospace;
            font-size: 0.65rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .control-drawer {
            display: none;
            background: #0b0e14;
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .control-drawer.open {
            display: block;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .drawer-title {
            color: var(--gold-bright);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            font-family: inherit;
            border: none;
